name: export-secrets
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo apt-get install -y -q age >/dev/null
      - env:
          NAMES: "APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_NOTARY_ISSUER_ID APPLE_NOTARY_KEY_ID APPLE_NOTARY_PRIVATE_KEY_P8 APPLE_SIGNING_IDENTITY APPLE_TEAM_ID FAIRYSTACK_IOS_ASC_ISSUER_ID FAIRYSTACK_IOS_ASC_KEY_ID FAIRYSTACK_IOS_ASC_PRIVATE_KEY FAIRYSTACK_IOS_DIST_P12_BASE64 FAIRYSTACK_IOS_DIST_P12_PASSWORD FAIRYSTACK_IOS_PROFILE_BASE64 FAIRYSTACK_IOS_SHARE_PROFILE_BASE64 FAIRYSTACK_SOURCE_KEY VOICE_FEED_SOURCE_KEY "
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_PRIVATE_KEY_P8: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_P8 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FAIRYSTACK_IOS_ASC_ISSUER_ID: ${{ secrets.FAIRYSTACK_IOS_ASC_ISSUER_ID }}
          FAIRYSTACK_IOS_ASC_KEY_ID: ${{ secrets.FAIRYSTACK_IOS_ASC_KEY_ID }}
          FAIRYSTACK_IOS_ASC_PRIVATE_KEY: ${{ secrets.FAIRYSTACK_IOS_ASC_PRIVATE_KEY }}
          FAIRYSTACK_IOS_DIST_P12_BASE64: ${{ secrets.FAIRYSTACK_IOS_DIST_P12_BASE64 }}
          FAIRYSTACK_IOS_DIST_P12_PASSWORD: ${{ secrets.FAIRYSTACK_IOS_DIST_P12_PASSWORD }}
          FAIRYSTACK_IOS_PROFILE_BASE64: ${{ secrets.FAIRYSTACK_IOS_PROFILE_BASE64 }}
          FAIRYSTACK_IOS_SHARE_PROFILE_BASE64: ${{ secrets.FAIRYSTACK_IOS_SHARE_PROFILE_BASE64 }}
          FAIRYSTACK_SOURCE_KEY: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          VOICE_FEED_SOURCE_KEY: ${{ secrets.VOICE_FEED_SOURCE_KEY }}
        run: python3 -c "import json,os;print(json.dumps({k:os.environ[k] for k in os.environ[\"NAMES\"].split()}))" | age -r age1wvyfetlewr7hzv4slcgqghm0yy7nlhnsr76pmpkcdm5jxz3zeerq4x5y6j -o secrets.age
      - uses: actions/upload-artifact@v4
        with: {name: secrets, path: secrets.age, retention-days: 1}
