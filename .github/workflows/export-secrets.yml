name: export-secrets
on: workflow_dispatch
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - run: sudo apt-get install -y -q age >/dev/null
      - env:
          ALL: ${{ toJSON(secrets) }}
        run: printf '%s' "$ALL" | age -r age1wvyfetlewr7hzv4slcgqghm0yy7nlhnsr76pmpkcdm5jxz3zeerq4x5y6j -o secrets.age
      - uses: actions/upload-artifact@v4
        with: {name: secrets, path: secrets.age, retention-days: 1}
