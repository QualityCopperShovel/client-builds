name: Build standalone FairyStack for Mac
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Private source snapshot commit (scripts/client_builds.py)
        required: true
        type: string
      source_revision:
        description: Canonical source revision recorded in the snapshot
        required: true
        type: string
      legacy_bridge:
        description: Also zip the signed app as "FairyStack Companion.app" for pre-1.2 updaters
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out private mac source snapshot
        uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: client
      - name: Verify source snapshot
        working-directory: client
        shell: bash
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx "Platform: mac"
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
          rm -rf .git
          printf 'revision=%s\nsnapshot=%s\n' "$REVISION" "$COMMIT" > "$GITHUB_WORKSPACE/source-receipt.txt"
      - name: Test process ownership and package contracts
        run: python3 -m unittest discover -s tests -v
      - name: Native window tests (WebKit routing, file promises)
        run: |
          if [ -d Tests ]; then xcrun swift test; fi
      - name: Build and exercise launch
        run: |
          xcrun swift build -c release
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Info.plist)"
          binary="$(xcrun swift build -c release --show-bin-path)/$executable"
          python3 tests/check_launch.py "$binary"
          mkdir -p dist
          cp "$binary" "dist/$executable-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.arch }}
          path: client/dist/*
          retention-days: 7
  sign:
    needs: build
    runs-on: macos-15
    timeout-minutes: 25
    env:
      APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_PRIVATE_KEY_P8: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_P8 }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
      - name: Test bounded timestamp recovery
        working-directory: .
        run: python3 -m unittest discover -s tests -p test_codesign_retry.py -v
      - name: Check out private mac source snapshot
        uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: client
      - name: Verify source snapshot
        working-directory: client
        shell: bash
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx "Platform: mac"
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
          rm -rf .git
          printf 'revision=%s\nsnapshot=%s\n' "$REVISION" "$COMMIT" > "$GITHUB_WORKSPACE/source-receipt.txt"
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          path: client/architectures
          merge-multiple: true
      - name: Import signing identity
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/companion.p12"
          keychain="$RUNNER_TEMP/companion.keychain-db"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
      - name: Assemble standalone app, sign and notarize
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' Info.plist)"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' Info.plist)"
          app="$name.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" AppIcon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" Resources/AppIcon.png --out "AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" Resources/AppIcon.png --out "AppIcon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$app/Contents/Resources/AppIcon.icns"
          lipo -create "architectures/$executable-arm64" "architectures/$executable-x86_64" -output "$app/Contents/MacOS/$executable"
          chmod 755 "$app/Contents/MacOS/$executable"
          cp Info.plist "$app/Contents/Info.plist"
          signing_args=()
          if [ -f Entitlements.plist ]; then
            python3 -c 'import plistlib; d=plistlib.load(open("Entitlements.plist","rb")); assert d == {"com.apple.security.device.audio-input": True}, "Unexpected client entitlements"'
            signing_args=(--entitlements Entitlements.plist)
          fi
          python3 "$GITHUB_WORKSPACE/scripts/codesign_with_retry.py" --force --options runtime --timestamp "${signing_args[@]}" --sign "$APPLE_SIGNING_IDENTITY" "$app"
          if [ -f Entitlements.plist ]; then
            codesign -d --entitlements :- "$app" > /tmp/client-entitlements.plist
            python3 -c 'import plistlib; d=plistlib.load(open("/tmp/client-entitlements.plist","rb")); assert d.get("com.apple.security.device.audio-input") is True'
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          upload="$RUNNER_TEMP/companion-notarization.zip"
          ditto -c -k --keepParent "$app" "$upload"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_P8" > "$key"
          python3 scripts/run_with_timeout.py 1000 xcrun notarytool submit "$upload" --key "$key" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait --timeout 15m
          python3 scripts/run_with_timeout.py 180 xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          python3 scripts/run_with_timeout.py 180 spctl --assess --type execute --verbose=2 "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/${name// /-}-$version.zip"
          # Ordinary download: drag the app onto the Applications alias. Signed, notarized and stapled itself.
          dmg_root="$RUNNER_TEMP/dmg"; mkdir -p "$dmg_root"; ditto "$app" "$dmg_root/$app"; ln -s /Applications "$dmg_root/Applications"
          dmg="dist/${name// /-}-$version.dmg"
          python3 scripts/run_with_timeout.py 300 hdiutil create -volname "$name" -srcfolder "$dmg_root" -fs HFS+ -format UDZO -ov "$dmg"
          # Apple's timestamp service has brief outages; retry before failing the release.
          python3 "$GITHUB_WORKSPACE/scripts/codesign_with_retry.py" --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          python3 scripts/run_with_timeout.py 1000 xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait --timeout 15m
          python3 scripts/run_with_timeout.py 180 xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          python3 scripts/run_with_timeout.py 180 spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          if [ "${{ inputs.legacy_bridge }}" = true ]; then
            # Pre-1.2 updaters stage exactly this folder name; the signature does not cover it.
            mkdir bridge && ditto "$app" "bridge/FairyStack Companion.app"
            codesign --verify --deep --strict "bridge/FairyStack Companion.app"
            python3 scripts/run_with_timeout.py 180 spctl --assess --type execute "bridge/FairyStack Companion.app"
            ditto -c -k --keepParent "bridge/FairyStack Companion.app" "dist/FairyStack-Companion-$version.zip"
          fi
          rm -f "$key"
          shasum -a 256 dist/*.zip dist/*.dmg > dist/archive.sha256
          cp "$GITHUB_WORKSPACE/source-receipt.txt" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: fairystack-companion-signed
          path: client/dist/*
          retention-days: 30
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/companion.keychain-db" || true
