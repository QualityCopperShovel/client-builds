name: Passage for iPhone
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Private Passage source snapshot
        required: true
        type: string
      revision:
        description: Passage source revision
        required: true
        type: string
      build_number:
        description: Source revision commit count
        required: true
        type: string
      mode:
        description: Signed device build or TestFlight upload
        required: true
        type: choice
        options: [adhoc, testflight]
permissions:
  contents: read
concurrency:
  group: passage-ios-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Check out private snapshot
        uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify source snapshot
        working-directory: native-client
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.revision }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ && "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx 'Platform: passage-ios'
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
          if [ "$MODE" = testflight ]; then git log -1 --format=%B | grep -qx 'Fixture: false'; fi
          git log -1 --format=%B | grep '^Fixture:' > ../content-receipt.txt
          rm -rf .git
      - name: Select Xcode and generate project
        working-directory: native-client
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          test "$(xcodebuild -version | sed -nE '1s/Xcode ([0-9]+).*/\1/p')" -ge 26
          python3 generate_project.py > "$RUNNER_TEMP/passage-build.log" 2>&1
      - name: Install signing identity and Passage profile
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          P12_BASE64: ${{ secrets.FAIRYSTACK_IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.FAIRYSTACK_IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ inputs.mode == 'adhoc' && secrets.PASSAGE_IOS_ADHOC_PROFILE_BASE64 || secrets.PASSAGE_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/distribution.p12"
          keychain="$RUNNER_TEMP/passage-ios.keychain-db"
          printf '%s' "$P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 2700 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"
          profile="$RUNNER_TEMP/passage.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -)"
          for folder in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$folder"; cp "$profile" "$folder/$uuid.mobileprovision"
          done
          rm -f "$profile"
      - name: Build and export signed app
        working-directory: native-client
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          profile='Passage App Store'
          method='app-store-connect'
          if [ "$MODE" = adhoc ]; then profile='Passage Ad Hoc'; method='release-testing'; fi
          export PROFILE="$profile" METHOD="$method"
          python3 - <<'PY'
          import os,plistlib
          with open('ExportOptions.plist','wb') as f:
              plistlib.dump({'method':os.environ['METHOD'],'teamID':'7ZPTPEXGRC','signingStyle':'manual','signingCertificate':'Apple Distribution','provisioningProfiles':{'com.excessivecode.passage':os.environ['PROFILE']}},f)
          PY
          xcodebuild -project Passage.xcodeproj -scheme Passage -configuration Release -destination 'generic/platform=iOS' -archivePath build/Passage.xcarchive CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' FAIRYSTACK_APP_PROFILE="$profile" archive >> "$RUNNER_TEMP/passage-build.log" 2>&1
          xcodebuild -exportArchive -archivePath build/Passage.xcarchive -exportPath build/export -exportOptionsPlist ExportOptions.plist >> "$RUNNER_TEMP/passage-build.log" 2>&1
          cp build/export/Passage.ipa ../Passage.ipa
          codesign --verify --deep --strict build/Passage.xcarchive/Products/Applications/Passage.app >> "$RUNNER_TEMP/passage-build.log" 2>&1
      - name: Simulator launch and theme screenshots
        working-directory: native-client
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for rows in d["devices"].values() for x in rows if x["name"].startswith("iPhone")))')
          xcodebuild -project Passage.xcodeproj -scheme Passage -configuration Debug -destination "platform=iOS Simulator,id=$device" -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build >> "$RUNNER_TEMP/passage-build.log" 2>&1
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b > /dev/null
          xcrun simctl install "$device" build/simulator/Build/Products/Debug-iphonesimulator/Passage.app
          mkdir -p ../screens
          for theme in light dark; do
            xcrun simctl terminate "$device" com.excessivecode.passage >/dev/null 2>&1 || true
            xcrun simctl ui "$device" appearance "$theme"
            xcrun simctl launch "$device" com.excessivecode.passage
            sleep 8
            xcrun simctl io "$device" screenshot "../screens/library-$theme.png"
          done
      - name: Upload to TestFlight
        if: inputs.mode == 'testflight'
        working-directory: native-client
        env:
          ASC_KEY_ID: ${{ secrets.FAIRYSTACK_IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.FAIRYSTACK_IOS_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.FAIRYSTACK_IOS_ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          key="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          xcrun altool --upload-app --type ios --file ../Passage.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" >> "$RUNNER_TEMP/passage-build.log" 2>&1
          rm -f "$key"
      - name: Write signed build receipt
        working-directory: native-client
        env:
          REVISION: ${{ inputs.revision }}
          SNAPSHOT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          plist=build/Passage.xcarchive/Products/Applications/Passage.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = com.excessivecode.passage
          {
            echo "revision=$REVISION"
            echo "snapshot=$SNAPSHOT"
            echo "build_number=$BUILD_NUMBER"
            echo "ipa_sha256=$(shasum -a 256 ../Passage.ipa | cut -d' ' -f1)"
            cat ../content-receipt.txt
            xcodebuild -version
          } > ../passage-receipt.txt
          cat ../passage-receipt.txt
      - name: Retain signed package and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: passage-ios-${{ inputs.mode }}
          path: |
            Passage.ipa
            passage-receipt.txt
            screens/
          if-no-files-found: error
          retention-days: 30
      - name: Encrypt private compiler diagnostics
        if: always()
        env:
          LOG_PASSWORD: ${{ secrets.PASSAGE_IOS_LOG_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/passage-build.log" ]; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:LOG_PASSWORD -in "$RUNNER_TEMP/passage-build.log" -out passage-build.log.enc
            rm -f "$RUNNER_TEMP/passage-build.log"
          fi
      - name: Retain encrypted diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passage-ios-diagnostics
          path: passage-build.log.enc
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove temporary signing files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/passage-ios.keychain-db" || true
          rm -f "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision "$HOME"/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision
          rm -f "$HOME"/.appstoreconnect/private_keys/*.p8
          rm -rf native-client/build
