name: Arrowsplit for iOS

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Private source snapshot commit (arrowsplit ios/testflight.py)
        required: true
        type: string
      source_revision:
        description: Arrowsplit revision recorded in the snapshot
        required: true
        type: string
      build_number:
        description: New positive App Store Connect build number
        required: true
        type: string
      mode:
        description: validate (simulator build + screenshot), testflight (signed upload) or adhoc (IPA for registered devices)
        required: true
        type: choice
        options: [validate, testflight, adhoc]

permissions:
  contents: read

concurrency:
  group: arrowsplit-ios-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Check out private source snapshot
        uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify source snapshot
        working-directory: native-client
        shell: bash
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ && "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx "Platform: arrowsplit-ios"
          git log -1 --format=%B | grep -qx "Arrowsplit-Revision: $REVISION"
          rm -rf .git
      - name: Select Xcode and generate project
        working-directory: native-client
        run: |
          set -euo pipefail
          # App Store Connect requires the iOS 26 SDK; use the newest installed Xcode.
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          version="$(xcodebuild -version)"; echo "$version"
          [ "$(sed -nE '1s/Xcode ([0-9]+).*/\1/p' <<<"$version")" -ge 26 ] || { echo "Xcode 26 or later is required; newest is $xcode"; exit 1; }
          python3 generate_project.py

      - name: Simulator build and screenshot
        if: inputs.mode == 'validate'
        working-directory: native-client
        run: |
          set -euo pipefail
          xcodebuild -project Arrowsplit.xcodeproj -scheme Arrowsplit -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO build | tail -5
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for rows in d["devices"].values() for x in rows if x["name"].startswith("iPhone")))')
          xcodebuild -project Arrowsplit.xcodeproj -scheme Arrowsplit -destination "platform=iOS Simulator,id=$device" -configuration Debug -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -5
          xcrun simctl boot "$device"; xcrun simctl bootstatus "$device" -b
                    app=dd/Build/Products/Debug-iphonesimulator/Arrowsplit.app
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          mkdir -p ../screens; sleep 25
          xcrun simctl io "$device" screenshot ../screens/arrowsplit-ios-launch.png
      - name: Retain screenshot
        if: inputs.mode == 'validate'
        uses: actions/upload-artifact@v4
        with:
          name: arrowsplit-ios-screens
          path: screens/
          if-no-files-found: error
          retention-days: 30

      - uses: ruby/setup-ruby@v1
        if: inputs.mode != 'validate'
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: native-client
      - name: Install distribution identity
        if: inputs.mode != 'validate'
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          P12_BASE64: ${{ secrets.FAIRYSTACK_IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.FAIRYSTACK_IOS_DIST_P12_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/distribution.p12"
          keychain="$RUNNER_TEMP/arrowsplit-ios.keychain-db"
          printf '%s' "$P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 2700 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution' || { echo 'Apple Distribution identity missing'; exit 1; }
      - name: Archive and export (and upload to TestFlight)
        if: inputs.mode != 'validate'
        working-directory: native-client
        env:
          ASC_KEY_ID: ${{ secrets.FAIRYSTACK_IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.FAIRYSTACK_IOS_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.FAIRYSTACK_IOS_ASC_PRIVATE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          SPACESHIP_TIMEOUT: '30'
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '60'
        run: bundle exec fastlane ios ${{ inputs.mode == 'testflight' && 'beta' || 'adhoc' }}
      - name: Write build receipt
        if: inputs.mode != 'validate'
        working-directory: native-client
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          plist=build/Arrowsplit.xcarchive/Products/Applications/Arrowsplit.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUILD_NUMBER"
          {
            echo "source_revision=$SOURCE_REVISION"
            echo "source_snapshot=$SOURCE_COMMIT"
            echo "build_number=$BUILD_NUMBER"
            echo "marketing_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
            echo "ipa_sha256=$(shasum -a 256 build/Arrowsplit.ipa | cut -d' ' -f1)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
          } | tee ../testflight-receipt.txt
      - name: Retain build receipt
        if: inputs.mode != 'validate'
        uses: actions/upload-artifact@v4
        with:
          name: arrowsplit-ios-${{ inputs.mode }}-${{ inputs.build_number }}
          path: testflight-receipt.txt
          if-no-files-found: error
          retention-days: 90
      - name: Retain ad hoc IPA
        if: inputs.mode == 'adhoc'
        uses: actions/upload-artifact@v4
        with:
          name: arrowsplit-ios-adhoc
          path: native-client/build/Arrowsplit.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always() && inputs.mode != 'validate'
        run: |
          security delete-keychain "$RUNNER_TEMP/arrowsplit-ios.keychain-db" || true
          rm -f "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision "$HOME"/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision
          rm -rf native-client/build
