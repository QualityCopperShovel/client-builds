name: Validate Apple client source

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Private source snapshot commit (scripts/client_builds.py)
        required: true
        type: string
      source_revision:
        description: Canonical source revision recorded in the snapshot
        required: true
        type: string
      runner:
        description: Hosted macOS runner; macos-15-intel when arm64 capacity is short
        required: false
        default: macos-15
        type: choice
        options: [macos-15, macos-15-intel]
permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    # Covers every bounded step below plus runner overhead, so a step deadline fires first.
    timeout-minutes: 10
    steps:
      - name: Check out validation helpers
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
          path: workflow
      - name: Check out private ios source snapshot
        uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify source snapshot
        working-directory: native-client
        shell: bash
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx "Platform: ios"
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
          rm -rf .git
          printf 'revision=%s\nsnapshot=%s\n' "$REVISION" "$COMMIT" > "$GITHUB_WORKSPACE/source-receipt.txt"
      - name: Select the current distribution toolchain
        run: |
          set -euo pipefail
          # Match TestFlight. The runner default still selects Xcode 16.4.
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Verify descendant timeout and partial evidence
        timeout-minutes: 1
        run: python3 workflow/scripts/verify_codec_timeout.py
      - name: Prepare direct probe from verified private source
        timeout-minutes: 1
        run: python3 workflow/scripts/prepare_direct_codec.py
      - name: Save preflight evidence before codec execution
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: codec-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codec-evidence/descendant-timeout.json
            codec-evidence/probe-plan.json
            source-receipt.txt
          if-no-files-found: error
          retention-days: 14
      - name: Compile direct synchronous codec executable
        timeout-minutes: 3
        run: python3 workflow/scripts/run_with_timeout.py 90 xcrun swiftc -parse-as-library probe-window.swift native-client/CodecProbe/DirectCodecProbe.swift -o direct-codec-probe
      - name: Run direct codec cases without XCTest or Swift test
        timeout-minutes: 3
        run: python3 workflow/scripts/run_with_timeout.py 135 python3 workflow/scripts/run_direct_codec.py
      - name: Retain partial synthetic codec evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: isolated-codec-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            codec-evidence/**/*.json*
            codec-evidence/**/*.txt
            source-receipt.txt
          if-no-files-found: error
          retention-days: 14
