name: Validate Apple client source

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Private source snapshot commit (scripts/client_builds.py)
        required: true
        type: string
      source_revision:
        description: Canonical source revision recorded in the snapshot
        required: true
        type: string
permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out validation helpers
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/run_with_timeout.py
          sparse-checkout-cone-mode: false
          path: workflow
      - name: Check out private ios source snapshot
        uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify source snapshot
        working-directory: native-client
        shell: bash
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx "Platform: ios"
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
          rm -rf .git
          printf 'revision=%s\nsnapshot=%s\n' "$REVISION" "$COMMIT" > "$GITHUB_WORKSPACE/source-receipt.txt"
      - name: Select the current distribution toolchain
        run: |
          set -euo pipefail
          # Match TestFlight. The runner default still selects Xcode 16.4.
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Test core contracts
        working-directory: native-client
        run: swift test
      - name: Build iPhone
        working-directory: native-client
        run: |
          python3 generate_project.py
          xcodebuild -version
          python3 "$GITHUB_WORKSPACE/workflow/scripts/run_with_timeout.py" 360 xcodebuild -project FairyStack.xcodeproj -scheme FairyStack -destination 'generic/platform=iOS' -configuration Release CODE_SIGNING_ALLOWED=NO build
      - name: Boot one simulator before testing
        id: simulator
        working-directory: native-client
        run: |
          bounded() { python3 "$GITHUB_WORKSPACE/workflow/scripts/run_with_timeout.py" "$@"; }
          # Use the newest installed iOS runtime, not the first (oldest) list entry.
          # iOS 18.5 has WebKit's missing libswiftWebKit launch fault (bug 293831).
          device=$(bounded 30 xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin)["devices"]; candidates=[(tuple(map(int,re.search(r"iOS-([0-9-]+)$",runtime)[1].split("-"))),x["udid"]) for runtime,rows in d.items() if re.search(r"iOS-([0-9-]+)$",runtime) for x in rows if x["name"].startswith("iPhone")]; print(max(candidates)[1])')
          printf 'device=%s\n' "$device" >> "$GITHUB_OUTPUT"
          bounded 60 xcrun simctl boot "$device"
          bounded 180 xcrun simctl bootstatus "$device" -b
      - name: Build simulator tests
        working-directory: native-client
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          python3 "$GITHUB_WORKSPACE/workflow/scripts/run_with_timeout.py" 360 xcodebuild -project FairyStack.xcodeproj -scheme FairyStack -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath dd CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build-for-testing
      - name: Launch app directly and check that it stays running
        working-directory: native-client
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          bounded() { python3 "$GITHUB_WORKSPACE/workflow/scripts/run_with_timeout.py" "$@"; }
          mkdir -p screenshots
          bounded 30 xcrun simctl install "$DEVICE" dd/Build/Products/Debug-iphonesimulator/FairyStack.app
          bounded 30 xcrun simctl launch --stdout="$PWD/screenshots/app-stdout.txt" --stderr="$PWD/screenshots/app-stderr.txt" "$DEVICE" com.fairystack.ios --fairystack-reset | tee screenshots/direct-launch.txt
          pid=$(sed -n 's/^com.fairystack.ios: //p' screenshots/direct-launch.txt)
          test -n "$pid"
          sleep 5
          ps -p "$pid" -o pid=,stat=,comm=
          bounded 20 xcrun simctl io "$DEVICE" screenshot screenshots/direct-launch.png
          bounded 20 xcrun simctl terminate "$DEVICE" com.fairystack.ios
      - name: Test simulator interactions on that device
        working-directory: native-client
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          python3 "$GITHUB_WORKSPACE/workflow/scripts/run_with_timeout.py" 600 xcodebuild -project FairyStack.xcodeproj -scheme FairyStack -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath dd -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 180 -resultBundlePath TestResults.xcresult test-without-building
      - name: Capture simulator evidence even after a failed launch
        if: always() && steps.simulator.outputs.device != ''
        working-directory: native-client
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          bounded() { python3 "$GITHUB_WORKSPACE/workflow/scripts/run_with_timeout.py" "$@"; }
          mkdir -p screenshots
          bounded 20 xcrun simctl io "$DEVICE" screenshot screenshots/last-simulator-state.png || true
          bounded 30 xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          bounded 20 xcrun simctl list devices booted
          bounded 20 xcrun simctl spawn "$DEVICE" log show --last 15m --style compact --predicate 'process == "FairyStack" OR ((process == "runningboardd" OR process == "amfid" OR process == "SpringBoard") AND eventMessage CONTAINS "com.fairystack.ios")' > screenshots/launch-events.txt || true
      - name: Retain immutable validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-client-validation-${{ inputs.source_revision }}
          # Screenshots and the receipt only: an .xcresult bundle carries build logs from the private source.
          path: |
            source-receipt.txt
            native-client/screenshots
          if-no-files-found: error
          retention-days: 14
