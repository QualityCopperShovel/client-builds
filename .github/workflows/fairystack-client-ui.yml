name: Exercise Windows and Android client UIs

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Client to exercise
        default: both
        type: choice
        options: [both, windows, android]
      source_commit:
        description: Private Android source snapshot commit (required unless platform is windows)
        required: false
        type: string
      source_revision:
        description: Canonical source revision recorded in the snapshot
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows:
    if: inputs.platform != 'android'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pywinauto==0.6.9 Pillow==11.3.0 cryptography==46.0.1
      - name: Install published client and interact with its window
        run: python scripts/client-ui/windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  android:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check out private android source snapshot
        uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: client/native/android
      - name: Verify source snapshot
        working-directory: client/native/android
        shell: bash
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx "Platform: android"
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
          rm -rf .git
          printf 'revision=%s\nsnapshot=%s\n' "$REVISION" "$COMMIT" > "$GITHUB_WORKSPACE/source-receipt.txt"
      - name: Prepare emulator
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          python3 scripts/client-ui/android.py prepare
          sudo chmod a+rw /dev/kvm
          timeout 300 bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "system-images;android-36;google_apis;x86_64"'
          export ANDROID_AVD_HOME="$RUNNER_TEMP/client-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n client-ui -k 'system-images;android-36;google_apis;x86_64' --path "$ANDROID_AVD_HOME/client-ui.avd" --force
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee evidence/avds.txt
          grep -qx client-ui evidence/avds.txt
          "$ANDROID_HOME/emulator/emulator" -avd client-ui -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > evidence/emulator.log 2>&1 &
      - name: Build isolated test-signed client and run device interactions
        run: python3 scripts/client-ui/android.py test
      - name: Stop emulator
        if: always()
        run: timeout 10 adb emu kill || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
