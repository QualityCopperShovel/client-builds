name: FairyStack for iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Private source snapshot commit (scripts/client_builds.py)
        required: true
        type: string
      source_revision:
        description: Canonical source revision recorded in the snapshot
        required: true
        type: string
      build_number:
        description: New positive App Store Connect build number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fairystack-ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Check out private ios source snapshot
        uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify source snapshot
        working-directory: native-client
        shell: bash
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx "Platform: ios"
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
          rm -rf .git
          printf 'revision=%s\nsnapshot=%s\n' "$REVISION" "$COMMIT" > "$GITHUB_WORKSPACE/source-receipt.txt"
      - name: Generate Xcode project
        working-directory: native-client
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          python3 generate_project.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: native-client
      - name: Install distribution identity and App Store profile
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          P12_BASE64: ${{ secrets.FAIRYSTACK_IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.FAIRYSTACK_IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.FAIRYSTACK_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/distribution.p12"
          keychain="$RUNNER_TEMP/fairystack-ios.keychain-db"
          printf '%s' "$P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 2700 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution' || { echo 'Apple Distribution identity missing'; exit 1; }
          profile="$RUNNER_TEMP/fairystack.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -)"
          for folder in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$folder" && cp "$profile" "$folder/$uuid.mobileprovision"
          done
          rm -f "$profile"
      - name: Archive, export and upload to TestFlight
        working-directory: native-client
        env:
          ASC_KEY_ID: ${{ secrets.FAIRYSTACK_IOS_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.FAIRYSTACK_IOS_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.FAIRYSTACK_IOS_ASC_PRIVATE_KEY }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          SPACESHIP_TIMEOUT: '30'
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '60'
        run: |
          set -euo pipefail
          # App Store Connect requires the iOS 26 SDK; use the newest installed Xcode.
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          version="$(xcodebuild -version)"
          echo "$version"
          major="$(sed -nE '1s/Xcode ([0-9]+).*/\1/p' <<<"$version")"
          [ "$major" -ge 26 ] || { echo "Xcode 26 or later is required; newest is $xcode"; exit 1; }
          bundle exec fastlane ios beta
      - name: Write build receipt
        working-directory: native-client
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          plist=build/FairyStack.xcarchive/Products/Applications/FairyStack.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$plist")" = "false"
          {
            echo "source_revision=$SOURCE_REVISION"
            echo "source_snapshot=$SOURCE_COMMIT"
            echo "build_number=$BUILD_NUMBER"
            echo "marketing_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"
            echo "archive_binary_sha256=$(shasum -a 256 build/FairyStack.xcarchive/Products/Applications/FairyStack.app/FairyStack | cut -d' ' -f1)"
            echo "ipa_sha256=$(shasum -a 256 build/FairyStack.ipa | cut -d' ' -f1)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
          } > ../testflight-receipt.txt
          cat ../testflight-receipt.txt
      - name: Retain build receipt
        uses: actions/upload-artifact@v4
        with:
          name: fairystack-ios-testflight-${{ inputs.build_number }}
          path: testflight-receipt.txt
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/fairystack-ios.keychain-db" || true
          rm -f "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision "$HOME"/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision
