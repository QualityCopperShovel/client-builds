name: FairyStack for iOS ad hoc

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Private source snapshot commit (scripts/client_builds.py)
        required: true
        type: string
      source_revision:
        description: Canonical source revision recorded in the snapshot
        required: true
        type: string
      build_number:
        description: Positive build number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fairystack-ios-adhoc
  cancel-in-progress: false

jobs:
  adhoc:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Check out private ios source snapshot
        uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify source snapshot
        working-directory: native-client
        shell: bash
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx "Platform: ios"
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
          if git log -1 --format=%B | grep -qx 'Launch-Check-Only: true'; then
            echo 'Diagnostic frozen-recorder snapshot cannot be uploaded'; exit 1
          fi
          rm -rf .git
          printf 'revision=%s\nsnapshot=%s\n' "$REVISION" "$COMMIT" > "$GITHUB_WORKSPACE/source-receipt.txt"
      - name: Generate Xcode project
        working-directory: native-client
        run: |
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          python3 generate_project.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: native-client
      - name: Install distribution identity and ad hoc profiles
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
          P12_BASE64: ${{ secrets.FAIRYSTACK_IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.FAIRYSTACK_IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.FAIRYSTACK_IOS_ADHOC_PROFILE_BASE64 }}
          SHARE_PROFILE_BASE64: ${{ secrets.FAIRYSTACK_IOS_ADHOC_SHARE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/distribution.p12"
          keychain="$RUNNER_TEMP/fairystack-ios.keychain-db"
          printf '%s' "$P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 2700 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution' || { echo 'Apple Distribution identity missing'; exit 1; }
          # The app and its share extension each have an ad hoc profile.
          for encoded in "$PROFILE_BASE64" "$SHARE_PROFILE_BASE64"; do
            [ -n "$encoded" ] || { echo 'ad hoc profile secret missing'; exit 1; }
            profile="$RUNNER_TEMP/fairystack.mobileprovision"
            printf '%s' "$encoded" | base64 --decode > "$profile"
            uuid="$(security cms -D -i "$profile" | plutil -extract UUID raw -)"
            for folder in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$folder" && cp "$profile" "$folder/$uuid.mobileprovision"
            done
            rm -f "$profile"
          done
      - name: Archive and export ad hoc
        working-directory: native-client
        env:
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '60'
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          bundle exec fastlane ios adhoc
      - name: Encrypt package
        working-directory: native-client
        env:
          ADHOC_PASSWORD: ${{ secrets.FAIRYSTACK_IOS_ADHOC_PASSWORD }}
        run: |
          set -euo pipefail
          ipas=(build/*.ipa); [ "${#ipas[@]}" -eq 1 ] && [ -f "${ipas[0]}" ]
          mkdir -p ../out
          plist="$(ls -d build/*.xcarchive)/Products/Applications/"; plist="$(ls -d "$plist"*.app)/Info.plist"
          { echo "build_number=$BUILD_NUMBER"; echo "marketing_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")"; echo "ipa_sha256=$(shasum -a 256 "${ipas[0]}" | cut -d' ' -f1)"; } > ../out/receipt.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -pass env:ADHOC_PASSWORD -in "${ipas[0]}" -out ../out/app.ipa.enc
          cat ../out/receipt.txt
      - name: Retain encrypted package
        uses: actions/upload-artifact@v4
        with:
          name: fairystack-ios-adhoc-${{ inputs.build_number }}
          path: out/
          if-no-files-found: error
          retention-days: 3
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/fairystack-ios.keychain-db" || true
          rm -f "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision "$HOME"/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision
