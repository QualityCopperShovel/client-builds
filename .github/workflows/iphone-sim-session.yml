name: iPhone Simulator session
# An agent drives Excessive Code for iOS on a hosted Mac's simulator, so testing never takes over
# anyone's own screen. The runner serves scripts/sim-relay.py through a Cloudflare quick tunnel and
# uploads its address and token encrypted to the caller's one-time public key (native/ios/simulator.py).
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Private ios source snapshot commit (scripts/client_builds.py)
        required: true
        type: string
      source_revision:
        description: Canonical source revision recorded in the snapshot
        required: true
        type: string
      public_key:
        description: Base64 PEM RSA public key that encrypts the session handoff
        required: true
        type: string
      minutes:
        description: Session length in minutes (5-60)
        required: false
        default: '30'
        type: string
      axe_version:
        description: AXe release (default 1.6.0, which taps and reads 3-4x faster than later builds)
        required: false
        default: ''
        type: string
      runner:
        description: Hosted macOS runner; macos-15-intel when arm64 capacity is short
        required: false
        default: macos-15
        type: choice
        options: [macos-15, macos-15-intel]
permissions:
  contents: read
jobs:
  session:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - name: Check out relay
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          path: workflow
      - name: Check out private ios source snapshot
        uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify source snapshot
        id: source
        working-directory: native-client
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ && "$MINUTES" =~ ^[0-9]+$ ]]
          (( MINUTES >= 5 && MINUTES <= 60 ))
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx "Platform: ios"
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
          # Key the built app on the snapshot tree minus test sources (UI tests embed web files), so
          # revisions with unchanged app files share one build.
          echo "tree=$(git ls-tree HEAD | awk -F'\t' '$2 != "UITests" && $2 != "Tests"' | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
          rm -rf .git
      # Boot in the background: the cold first boot overlaps tool setup, cache restore and the tunnel.
      - name: Start booting an iPhone 16 simulator
        id: simulator
        run: |
          set -euo pipefail
          bounded() { python3 workflow/scripts/run_with_timeout.py "$@"; }
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          runtime=com.apple.CoreSimulator.SimRuntime.iOS-18-6
          device=$(bounded 60 xcrun simctl create "Session-$GITHUB_RUN_ID" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          echo "device=$device" >> "$GITHUB_OUTPUT"
          nohup python3 workflow/scripts/run_with_timeout.py 240 xcrun simctl boot "$device" > "$RUNNER_TEMP/boot.log" 2>&1 &
      - name: Install AXe and cloudflared
        env:
          AXE_VERSION: ${{ inputs.axe_version || '1.6.0' }}
          CLOUDFLARED_VERSION: 2026.10.7
        run: |
          set -euo pipefail
          [[ "$AXE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo amd64)
          mkdir -p "$RUNNER_TEMP/axe" "$RUNNER_TEMP/bin"
          curl -fsSL -m 120 "https://github.com/cameroncooke/AXe/releases/download/v$AXE_VERSION/AXe-macOS-v$AXE_VERSION-universal.tar.gz" | tar xz -C "$RUNNER_TEMP/axe" & axe_pid=$!
          curl -fsSL -m 120 "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-darwin-$arch.tgz" | tar xz -C "$RUNNER_TEMP/bin" & cf_pid=$!
          wait "$axe_pid"; wait "$cf_pid"
          printf '%s\n' "$RUNNER_TEMP/axe" "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/axe/axe" --version; "$RUNNER_TEMP/bin/cloudflared" --version
      - name: Start relay and tunnel
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          token=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "$token" > "$RUNNER_TEMP/relay-token"
          export RELAY_TOKEN="$token" DEADLINE=$(( $(date +%s) + MINUTES * 60 )) RELAY_LOG=evidence/relay.log
          echo "$DEADLINE" > "$RUNNER_TEMP/relay-deadline"
          nohup python3 workflow/scripts/sim-relay.py > evidence/relay-stdout.txt 2>&1 &
          echo $! > relay.pid
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8765 > "$RUNNER_TEMP/tunnel.log" 2>&1 &
      - name: Restore a built app for this source
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: native-client/dd/Build/Products/Debug-iphonesimulator
          key: iphone-sim-app-${{ inputs.runner || 'macos-15' }}-tree-${{ steps.source.outputs.tree }}
      - name: Build the app for the simulator
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: native-client
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 generate_project.py
          projects=(*.xcodeproj); [ "${#projects[@]}" -eq 1 ]
          scheme="${projects[0]%.xcodeproj}"
          python3 "$GITHUB_WORKSPACE/workflow/scripts/run_with_timeout.py" 900 xcodebuild -project "${projects[0]}" -scheme "$scheme" -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath dd ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build > "$RUNNER_TEMP/build.log" 2>&1 || { tail -40 "$RUNNER_TEMP/build.log" | grep -E 'error|warning: fatal' ; exit 1; }
      - name: Save the built app
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-client/dd/Build/Products/Debug-iphonesimulator
          key: iphone-sim-app-${{ inputs.runner || 'macos-15' }}-tree-${{ steps.source.outputs.tree }}
      - name: Install and open the app
        working-directory: native-client
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          set -euo pipefail
          bounded() { python3 "$GITHUB_WORKSPACE/workflow/scripts/run_with_timeout.py" "$@"; }
          apps=(dd/Build/Products/Debug-iphonesimulator/*.app); [ "${#apps[@]}" -eq 1 ]
          bounded 300 xcrun simctl bootstatus "$DEVICE" -b > /dev/null || { cat "$RUNNER_TEMP/boot.log"; exit 1; }
          bounded 90 xcrun simctl install "$DEVICE" "${apps[0]}"
          # Grant the mic up front: its system alert blocks screen reads and screenshots.
          xcrun simctl privacy "$DEVICE" grant microphone com.fairystack.ios || true
          xcrun simctl launch "$DEVICE" com.fairystack.ios --excessivecode-reset
      - name: Encrypt the handoff
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          token=$(cat "$RUNNER_TEMP/relay-token"); deadline=$(cat "$RUNNER_TEMP/relay-deadline")
          url=""
          for _ in $(seq 120); do
            url=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/tunnel.log" | head -1 || true)
            [ -n "$url" ] && break; sleep 1
          done
          [ -n "$url" ] || { echo "tunnel gave no address"; exit 1; }
          echo "::add-mask::$url"; echo "::add-mask::${url#https://}"
          for _ in $(seq 120); do curl -fsS -m 5 --doh-url https://1.1.1.1/dns-query "$url/health" > /dev/null 2>&1 && break; sleep 1; done
          curl -fsS -m 5 --doh-url https://1.1.1.1/dns-query "$url/health" > /dev/null
          echo "$PUBLIC_KEY" | base64 -d > pub.pem
          printf '{"url":"%s","token":"%s","deadline":%s}' "$url" "$token" "$deadline" > plain.json
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in plain.json -out handoff/handoff.bin
          rm plain.json "$RUNNER_TEMP/relay-token"
      - name: Hand off the session
        uses: actions/upload-artifact@v4
        with:
          name: handoff
          path: handoff/handoff.bin
          retention-days: 1
      - name: Serve until stop, idle or deadline
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          pid=$(cat relay.pid)
          end=$(( $(date +%s) + MINUTES * 60 + 60 ))
          while kill -0 "$pid" 2>/dev/null && [ "$(date +%s)" -lt "$end" ]; do sleep 5; done
          tail -3 evidence/relay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-evidence
          # Request log only: this repo is public, so no screenshots of private chats.
          path: evidence/relay.log
          retention-days: 7
