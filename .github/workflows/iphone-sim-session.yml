name: iPhone Simulator session
# An agent drives Excessive Code for iOS on a hosted Mac's simulator, so testing never takes over
# anyone's own screen. The runner serves scripts/sim-relay.py through a Cloudflare quick tunnel and
# uploads its address and token encrypted to the caller's one-time public key (native/ios/simulator.py).
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Private ios source snapshot commit (scripts/client_builds.py)
        required: true
        type: string
      source_revision:
        description: Canonical source revision recorded in the snapshot
        required: true
        type: string
      public_key:
        description: Base64 PEM RSA public key that encrypts the session handoff
        required: true
        type: string
      minutes:
        description: Session length in minutes (5-60)
        required: false
        default: '30'
        type: string
      app:
        description: Optional hosted app config key (empty runs Excessive Code)
        required: false
        default: ''
        type: string
      runtime:
        description: iOS runtime (latest selects the newest installed runtime)
        required: false
        default: 'com.apple.CoreSimulator.SimRuntime.iOS-18-6'
        type: string
      axe_version:
        description: AXe release (default 1.6.0, which taps and reads 3-4x faster than later builds)
        required: false
        default: ''
        type: string
      runner:
        description: Hosted macOS runner; macos-15-intel when arm64 capacity is short
        required: false
        default: macos-15
        type: choice
        options: [macos-15, macos-15-intel]
permissions:
  contents: read
jobs:
  session:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - name: Check out relay
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          path: workflow
      - name: Check out private ios source snapshot
        uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify source snapshot
        id: source
        working-directory: native-client
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
          MINUTES: ${{ inputs.minutes }}
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ && "$MINUTES" =~ ^[0-9]+$ ]]
          (( MINUTES >= 5 && MINUTES <= 60 ))
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx "Platform: ios"
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
          # Key the built app on the snapshot tree minus test sources (UI tests embed web files), so
          # revisions with unchanged app files share one build.
          echo "tree=$(git ls-tree HEAD | awk -F'\t' '$2 != "UITests" && $2 != "Tests"' | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
          [[ -z "$APP" || "$APP" =~ ^[a-z0-9][a-z0-9-]{0,39}$ ]]
          bundle=com.fairystack.ios
          if [ -n "$APP" ]; then
            bundle=$(python3 -c 'import json,sys; print(json.load(open("app-configs/"+sys.argv[1]+".json"))["bundle_id"])' "$APP")
          fi
          echo "APP_BUNDLE=$bundle" >> "$GITHUB_ENV"
          rm -rf .git
      # Boot in the background: the cold first boot overlaps tool setup, cache restore and the tunnel.
      - name: Start booting an iPhone 16 simulator
        id: simulator
        run: |
          set -euo pipefail
          bounded() { python3 workflow/scripts/run_with_timeout.py "$@"; }
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          runtime='${{ inputs.runtime }}'
          if [ "$runtime" = latest ]; then
            runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]; print(max(r,key=lambda r:tuple(map(int,r["version"].split("."))))["identifier"])')
          fi
          [[ "$runtime" =~ ^com.apple.CoreSimulator.SimRuntime.iOS-[0-9]+-[0-9]+(-[0-9]+)?$ ]]
          echo "Runtime: $runtime"
          # The first simctl call starts CoreSimulator, which took over 60 s on a fresh runner.
          device=$(bounded 180 xcrun simctl create "Session-$GITHUB_RUN_ID" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$runtime")
          echo "device=$device" >> "$GITHUB_OUTPUT"
          # Which runtimes already have a shared cache here (a missing one is built on first boot, minutes).
          ls /Library/Developer/CoreSimulator/Caches/dyld/*/ 2>/dev/null || true
          nohup python3 workflow/scripts/run_with_timeout.py 240 xcrun simctl boot "$device" > "$RUNNER_TEMP/boot.log" 2>&1 &
      - name: Install AXe and cloudflared
        env:
          AXE_VERSION: ${{ inputs.axe_version || '1.6.0' }}
          CLOUDFLARED_VERSION: 2026.10.7
        run: |
          set -euo pipefail
          [[ "$AXE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo amd64)
          mkdir -p "$RUNNER_TEMP/axe" "$RUNNER_TEMP/bin"
          curl -fsSL -m 120 "https://github.com/cameroncooke/AXe/releases/download/v$AXE_VERSION/AXe-macOS-v$AXE_VERSION-universal.tar.gz" | tar xz -C "$RUNNER_TEMP/axe" & axe_pid=$!
          curl -fsSL -m 120 "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-darwin-$arch.tgz" | tar xz -C "$RUNNER_TEMP/bin" & cf_pid=$!
          wait "$axe_pid"; wait "$cf_pid"
          printf '%s\n' "$RUNNER_TEMP/axe" "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/axe/axe" --version; "$RUNNER_TEMP/bin/cloudflared" --version
      - name: Start relay and tunnel
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          token=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "$token" > "$RUNNER_TEMP/relay-token"
          export RELAY_TOKEN="$token" DEADLINE=$(( $(date +%s) + MINUTES * 60 )) RELAY_LOG=evidence/relay.log
          export RELAY_HANDOFF_FILE="$RUNNER_TEMP/relay-handed-off"
          rm -f "$RELAY_HANDOFF_FILE"
          echo "$DEADLINE" > "$RUNNER_TEMP/relay-deadline"
          nohup python3 workflow/scripts/sim-relay.py > evidence/relay-stdout.txt 2>&1 &
          echo $! > relay.pid
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8765 > "$RUNNER_TEMP/tunnel.log" 2>&1 &
      - name: Restore a built app for this source
        id: app-cache
        uses: actions/cache/restore@v4
        with:
          path: native-client/dd/Build/Products/Debug-iphonesimulator
          key: iphone-sim-app-${{ inputs.runner || 'macos-15' }}-tree-${{ steps.source.outputs.tree }}-app-${{ inputs.app }}
      - name: Build the app for the simulator
        if: steps.app-cache.outputs.cache-hit != 'true'
        working-directory: native-client
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          set -euo pipefail
          xcodebuild -version
          if [ -n '${{ inputs.app }}' ]; then
            python3 generate_hosted_app.py --config 'app-configs/${{ inputs.app }}.json' --output hosted-project
            cd hosted-project
          else
            python3 generate_project.py
          fi
          projects=(*.xcodeproj); [ "${#projects[@]}" -eq 1 ]
          scheme="${projects[0]%.xcodeproj}"
          python3 "$GITHUB_WORKSPACE/workflow/scripts/run_with_timeout.py" 900 xcodebuild -project "${projects[0]}" -scheme "$scheme" -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$GITHUB_WORKSPACE/native-client/dd" ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build > "$RUNNER_TEMP/build.log" 2>&1 || { tail -40 "$RUNNER_TEMP/build.log" | grep -E 'error|warning: fatal' ; exit 1; }
      - name: Save the built app
        if: steps.app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: native-client/dd/Build/Products/Debug-iphonesimulator
          key: iphone-sim-app-${{ inputs.runner || 'macos-15' }}-tree-${{ steps.source.outputs.tree }}-app-${{ inputs.app }}
      - name: Install and open the app
        working-directory: native-client
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: |
          set -euo pipefail
          # @lat: [[ios-runner#Interactive simulator startup]]
          export COMMAND_DEADLINE_MONOTONIC=$(python3 -c 'import time; print(time.monotonic()+420)')
          echo "$COMMAND_DEADLINE_MONOTONIC" > "$RUNNER_TEMP/startup-deadline"
          export COMMAND_TIMING_LOG="$GITHUB_WORKSPACE/evidence/startup.jsonl"
          stage() { local label=$1; shift; COMMAND_LABEL="$label" python3 "$GITHUB_WORKSPACE/workflow/scripts/run_with_timeout.py" "$@"; }
          apps=(dd/Build/Products/Debug-iphonesimulator/*.app); [ "${#apps[@]}" -eq 1 ]
          stage boot_ready 300 xcrun simctl bootstatus "$DEVICE" -b > "$GITHUB_WORKSPACE/evidence/boot-ready.log" 2>&1 || { cat "$GITHUB_WORKSPACE/evidence/boot-ready.log"; cat "$RUNNER_TEMP/boot.log"; exit 1; }
          failure_evidence() {
            # Reuse the original deadlines; save codes and process state, never app text.
            python3 "$GITHUB_WORKSPACE/workflow/scripts/capture_install_failure.py" \
              --stage "$1" --device "$DEVICE" --startup-deadline "$COMMAND_DEADLINE_MONOTONIC" \
              --session-deadline "$(cat "$RUNNER_TEMP/relay-deadline")" \
              --output "$GITHUB_WORKSPACE/evidence/$1-failure.json" \
              --startup-log "$COMMAND_TIMING_LOG" || true
          }
          stage install 90 xcrun simctl install "$DEVICE" "${apps[0]}" || {
            install_status=$?; failure_evidence install; exit "$install_status"
          }
          # Keep optional permission errors visible, but never continue after a stalled simctl.
          stage microphone_permission 20 xcrun simctl privacy "$DEVICE" grant microphone "$APP_BUNDLE" || { stage_status=$?; [ "$stage_status" -ne 124 ] || exit "$stage_status"; }
          stage location_permission 20 xcrun simctl privacy "$DEVICE" revoke location "$APP_BUNDLE" || { stage_status=$?; [ "$stage_status" -ne 124 ] || exit "$stage_status"; }
          stage launch 60 xcrun simctl launch "$DEVICE" "$APP_BUNDLE" --excessivecode-reset || {
            launch_status=$?; failure_evidence launch; exit "$launch_status"
          }
      - name: Encrypt the handoff
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          token=$(cat "$RUNNER_TEMP/relay-token"); deadline=$(cat "$RUNNER_TEMP/relay-deadline")
          # @lat: [[ios-runner#Public relay handoff health]]
          export COMMAND_DEADLINE_MONOTONIC=$(cat "$RUNNER_TEMP/startup-deadline")
          export COMMAND_TIMING_LOG="$GITHUB_WORKSPACE/evidence/startup.jsonl" COMMAND_LABEL=handoff_health
          python3 workflow/scripts/run_with_timeout.py 120 python3 workflow/scripts/wait_relay_health.py \
            --tunnel-log "$RUNNER_TEMP/tunnel.log" --output "$RUNNER_TEMP/tunnel-url" --session-deadline "$deadline"
          url=$(cat "$RUNNER_TEMP/tunnel-url")
          echo "::add-mask::$url"; echo "::add-mask::${url#https://}"
          echo "$PUBLIC_KEY" | base64 -d > pub.pem
          printf '{"url":"%s","token":"%s","deadline":%s}' "$url" "$token" "$deadline" > plain.json
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -in plain.json -out handoff/handoff.bin
          rm plain.json "$RUNNER_TEMP/relay-token"
      - name: Hand off the session
        uses: actions/upload-artifact@v4
        with:
          name: handoff
          path: handoff/handoff.bin
          retention-days: 1
      - name: Arm idle expiry after handoff
        run: touch "$RUNNER_TEMP/relay-handed-off"
      - name: Serve until stop, idle or deadline
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          pid=$(cat relay.pid)
          end=$(( $(date +%s) + MINUTES * 60 + 60 ))
          while kill -0 "$pid" 2>/dev/null && [ "$(date +%s)" -lt "$end" ]; do sleep 5; done
          tail -3 evidence/relay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-evidence
          # Content-free request/startup metadata and boot progress; no private screenshots.
          path: |
            evidence/relay.log
            evidence/startup.jsonl
            evidence/install-failure.json
            evidence/launch-failure.json
            evidence/boot-ready.log
          retention-days: 7
