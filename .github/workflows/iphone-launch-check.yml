name: iPhone launch burst
on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      source_revision:
        required: true
        type: string
      scenario:
        required: false
        default: full
        type: string
      verify_watchdog:
        description: Inject a stall and verify next-launch replay
        required: false
        default: false
        type: boolean
    secrets:
      FAIRYSTACK_SOURCE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      source_commit:
        required: true
        type: string
      source_revision:
        required: true
        type: string
      scenario:
        description: Full launch plus Send, or isolated Send regression
        required: false
        default: full
        type: choice
        options: [full, send]
      verify_watchdog:
        description: Inject a stall and verify next-launch replay
        required: false
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  launch:
    continue-on-error: true
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
    runs-on: macos-15
    timeout-minutes: 28
    steps: &launch_steps
      - uses: actions/checkout@v4
        with:
          path: workflow-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify source snapshot
        working-directory: native-client
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx 'Platform: ios'
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
      - name: Select Xcode and start gate clock
        id: xcode
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "EXCESSIVECODE_GATE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Reuse compiled SDK modules
        uses: actions/cache@v4
        timeout-minutes: 2
        with:
          path: native-client/build/launch-check/ModuleCache.noindex
          key: ios-launch-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}
      - name: Open app, launch burst, main-thread ping and watchdog
        working-directory: native-client
        timeout-minutes: 26
        env:
          EXCESSIVECODE_VERIFY_WATCHDOG: ${{ inputs.verify_watchdog && '1' || '0' }}
          EXCESSIVECODE_LAUNCH_CASE: ${{ inputs.scenario || 'full' }}
        run: |
          set -euo pipefail
          python3 ../workflow-tools/scripts/iphone_launch_gate.py
      - name: Record check verdict
        id: result
        if: always()
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          path = Path('native-client/launch-gate-result.json')
          outcome = json.loads(path.read_text())['outcome'] if path.exists() else 'runner_fault'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('outcome='+outcome+'\n')
          PYTHON
      - name: Retain launch check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-launch-check-${{ github.job }}
          path: |
            native-client/launch-gate-result.json
            native-client/launch-check-attempts/
            native-client/launch-check-result.json
            native-client/launch-check-build.log
          if-no-files-found: error
          retention-days: 90
  retry_runner:
    needs: launch
    if: ${{ !cancelled() && (needs.launch.outputs.outcome == '' || needs.launch.outputs.outcome == 'runner_fault') }}
    continue-on-error: true
    outputs:
      outcome: ${{ steps.result.outputs.outcome }}
    runs-on: macos-15
    timeout-minutes: 28
    env:
      EXCESSIVECODE_GATE_ATTEMPTS: '1'
    steps: *launch_steps
  verdict:
    needs: [launch, retry_runner]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report launch result
        env:
          FIRST: ${{ needs.launch.outputs.outcome }}
          RETRY: ${{ needs.retry_runner.outputs.outcome }}
        run: |
          result="$FIRST"
          if [ "$result" = runner_fault ] || [ -z "$result" ]; then result="$RETRY"; fi
          case "$result" in
            passed) echo 'Launch check passed' >> "$GITHUB_STEP_SUMMARY" ;;
            app_check_failed) echo '::error::App launch check failed; see bridge and main-thread evidence'; exit 1 ;;
            *) echo '::warning::Check could not run after one retry; no frozen-app verdict. Upload may proceed.'
               echo 'Check could not run after one retry (simulator or runner fault).' >> "$GITHUB_STEP_SUMMARY" ;;
          esac
