name: iPhone launch burst
on:
  workflow_call:
    inputs:
      source_commit:
        required: true
        type: string
      source_revision:
        required: true
        type: string
      scenario:
        required: false
        default: full
        type: string
      verify_watchdog:
        description: Inject a stall and verify next-launch replay
        required: false
        default: false
        type: boolean
    secrets:
      FAIRYSTACK_SOURCE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      source_commit:
        required: true
        type: string
      source_revision:
        required: true
        type: string
      scenario:
        description: Full launch plus Send, or isolated Send regression
        required: false
        default: full
        type: choice
        options: [full, send]
      verify_watchdog:
        description: Inject a stall and verify next-launch replay
        required: false
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  launch:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify source snapshot
        working-directory: native-client
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx 'Platform: ios'
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
      - name: Select Xcode and start gate clock
        id: xcode
        timeout-minutes: 2
        run: |
          set -euo pipefail
          echo "EXCESSIVECODE_GATE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Reuse compiled SDK modules
        uses: actions/cache@v4
        timeout-minutes: 2
        with:
          path: native-client/build/launch-check/ModuleCache.noindex
          key: ios-launch-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}
      - name: Open app, launch burst, main-thread ping and watchdog
        working-directory: native-client
        timeout-minutes: 13
        env:
          EXCESSIVECODE_VERIFY_WATCHDOG: ${{ inputs.verify_watchdog && '1' || '0' }}
          EXCESSIVECODE_LAUNCH_CASE: ${{ inputs.scenario || 'full' }}
        run: |
          set -euo pipefail
          python3 launch_check.py
      - name: Retain launch check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-launch-check
          path: |
            native-client/launch-check-result.json
            native-client/launch-check-build.log
          if-no-files-found: error
          retention-days: 90
