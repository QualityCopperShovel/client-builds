name: iPhone launch cache trial
on:
  workflow_dispatch:
    inputs:
      source_commit:
        required: true
        type: string
      source_revision:
        required: true
        type: string
permissions:
  contents: read
jobs:
  trial:
    runs-on: macos-15
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          path: workflow-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify exact private source
        working-directory: native-client
        env:
          COMMIT: ${{ inputs.source_commit }}
          REVISION: ${{ inputs.source_revision }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$COMMIT"
          git log -1 --format=%B | grep -qx 'Platform: ios'
          git log -1 --format=%B | grep -qx "FairyStack-Revision: $REVISION"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-tree"
      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_[0-9]*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Reuse compiled SDK modules
        uses: actions/cache@v4
        with:
          path: native-client/build/launch-check/ModuleCache.noindex
          key: ios-launch-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}
      - name: Cold launch gate
        working-directory: native-client
        env:
          EXCESSIVECODE_VERIFY_WATCHDOG: '1'
          EXCESSIVECODE_LAUNCH_CASE: full
          EXCESSIVECODE_GATE_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          export EXCESSIVECODE_GATE_STARTED_AT=$(date +%s)
          python3 ../workflow-tools/scripts/iphone_launch_gate.py || true
          mkdir -p "$RUNNER_TEMP/evidence/cold"
          cp launch-gate-result.json launch-check-result.json "$RUNNER_TEMP/evidence/cold/"
      - name: Measure save and remove checkout
        run: |
          set -euo pipefail
          start=$(date +%s)
          tar -czf "$RUNNER_TEMP/launch-build.tar.gz" -C native-client/build launch-check
          end=$(date +%s)
          echo "save_seconds=$((end-start)) bytes=$(stat -f %z "$RUNNER_TEMP/launch-build.tar.gz")" | tee "$RUNNER_TEMP/evidence/cache-timing.txt"
          rm -rf native-client
      - uses: actions/checkout@v4
        with:
          repository: QualityCopperShovel/fairystack
          ref: ${{ inputs.source_commit }}
          ssh-key: ${{ secrets.FAIRYSTACK_SOURCE_KEY }}
          persist-credentials: false
          path: native-client
      - name: Verify source and measure restore
        run: |
          set -euo pipefail
          test "$(git -C native-client rev-parse HEAD)" = '${{ inputs.source_commit }}'
          test "$(git -C native-client rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/source-tree")"
          mkdir -p native-client/build
          start=$(date +%s)
          tar -xzf "$RUNNER_TEMP/launch-build.tar.gz" -C native-client/build
          end=$(date +%s)
          echo "restore_seconds=$((end-start))" | tee -a "$RUNNER_TEMP/evidence/cache-timing.txt"
      - name: Restored launch gate
        working-directory: native-client
        env:
          EXCESSIVECODE_VERIFY_WATCHDOG: '1'
          EXCESSIVECODE_LAUNCH_CASE: full
          EXCESSIVECODE_GATE_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          export EXCESSIVECODE_GATE_STARTED_AT=$(date +%s)
          python3 ../workflow-tools/scripts/iphone_launch_gate.py || true
          mkdir -p "$RUNNER_TEMP/evidence/restored"
          cp launch-gate-result.json launch-check-result.json "$RUNNER_TEMP/evidence/restored/"
      - name: Report both gate verdicts
        run: |
          python3 -c "import json, os, pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'evidence'; a=[json.loads((p/n/'launch-gate-result.json').read_text())['outcome'] for n in ('cold','restored')]; print('Gate outcomes:', *a); assert a == ['passed', 'passed']"
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-cache-trial-results
          path: |
            ${{ runner.temp }}/evidence/
            native-client/launch-gate-result.json
            native-client/launch-check-result.json
            native-client/launch-check-build.log
          retention-days: 1
